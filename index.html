<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Recap AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
    }

    .container {
      width: 90%;
      max-width: 900px;
      margin: 50px auto;
    }

    h1 {
      text-align: center;
      font-size: 40px;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #9ca3af;
      margin-bottom: 40px;
    }

    .box {
      background: #1f2937;
      padding: 25px;
      border-radius: 15px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-size: 18px;
    }

    input,
    textarea {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #374151;
      color: white;
      font-size: 16px;
      margin-bottom: 20px;
      outline: none;
    }

    textarea {
      min-height: 220px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #6366f1;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    button:hover {
      background: #4f46e5;
    }

    .result {
      min-height: 150px;
      background: #111827;
      padding: 20px;
      border-radius: 10px;
      color: #d1d5db;
      line-height: 1.8;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🎬 Movie Recap AI</h1>

    <p class="subtitle">
      Movie ဇာတ်လမ်းကို Recap Script အဖြစ် ပြောင်းလဲရန်
    </p>

    <div class="box">

      <label>🎬 Movie Name</label>

      <input
        type="text"
        id="movieName"
        placeholder="Movie နာမည်ထည့်ပါ..."
      >

      <label>📝 Movie Story / Transcript</label>

      <textarea
        id="movieText"
        placeholder="Movie ရဲ့ စာသား ဒါမှမဟုတ် Transcript ကို ဒီနေရာမှာထည့်ပါ..."
      ></textarea>

      <button onclick="generateRecap()">
        🤖 Generate Movie Recap
      </button>

    </div>

    <div class="box">

      <label>📋 Recap Script</label>

      <div class="result" id="result">
        ဒီနေရာမှာ AI ထုတ်ပေးတဲ့ Movie Recap Script ပေါ်လာမယ်။
      </div>

    </div>

  </div>

  <script>

    function generateRecap() {

      const movieName =
        document.getElementById("movieName").value;

      const movieText =
        document.getElementById("movieText").value;

      const result =
        document.getElementById("result");

      if (movieName === "" || movieText === "") {

        result.innerHTML =
          "⚠️ Movie Name နဲ့ Movie Story / Transcript ကို အရင်ထည့်ပါ။";

        return;
      }

      result.innerHTML =
        "<strong>" + movieName + "</strong><br><br>" +
        "ဒီနေရာမှာ နောက်ပိုင်း AI နဲ့ Movie Recap Script ကို generate လုပ်ပေးမယ်။";

    }

  </script>

</body>
</html>
