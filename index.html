<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Movie Recap AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
    }

    .container {
      width: 90%;
      max-width: 900px;
      margin: 40px auto;
    }

    h1 {
      text-align: center;
      font-size: 38px;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #9ca3af;
      margin-bottom: 30px;
    }

    .box {
      background: #1f2937;
      padding: 25px;
      border-radius: 15px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-size: 18px;
      font-weight: bold;
    }

    input[type="file"] {
      width: 100%;
      padding: 15px;
      background: #374151;
      color: white;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    video {
      width: 100%;
      max-height: 500px;
      background: black;
      border-radius: 12px;
      display: none;
      margin-top: 15px;
    }

    .info {
      background: #111827;
      padding: 15px;
      border-radius: 10px;
      margin-top: 15px;
      line-height: 1.8;
      display: none;
    }

    .success {
      color: #4ade80;
    }

    .error {
      color: #f87171;
    }

    .status {
      margin-top: 15px;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🎬 Movie Recap AI</h1>

    <p class="subtitle">
      Movie ကို Recap Video အဖြစ် ပြောင်းလဲရန်
    </p>

    <div class="box">

      <label>🎥 Movie Upload</label>

      <input
        type="file"
        id="movieFile"
        accept="video/mp4"
      >

      <div class="status" id="status">
        MP4 Movie ကို ရွေးပါ။
      </div>

      <video id="videoPreview" controls></video>

      <div class="info" id="videoInfo">
        <div>📁 File: <span id="fileName"></span></div>
        <div>⏱️ Duration: <span id="duration"></span></div>
        <div>📦 Size: <span id="fileSize"></span></div>
      </div>

    </div>

  </div>

  <script>

    const movieFile = document.getElementById("movieFile");
    const videoPreview = document.getElementById("videoPreview");
    const videoInfo = document.getElementById("videoInfo");

    const status = document.getElementById("status");
    const fileName = document.getElementById("fileName");
    const duration = document.getElementById("duration");
    const fileSize = document.getElementById("fileSize");

    const MAX_DURATION = 5 * 60;

    movieFile.addEventListener("change", function () {

      const file = this.files[0];

      if (!file) {
        return;
      }

      if (file.type !== "video/mp4") {

        status.innerHTML =
          '<span class="error">❌ MP4 Video ပဲ တင်နိုင်ပါတယ်။</span>';

        movieFile.value = "";

        videoPreview.style.display = "none";
        videoInfo.style.display = "none";

        return;
      }

      const videoURL = URL.createObjectURL(file);

      videoPreview.src = videoURL;
      videoPreview.style.display = "block";

      fileName.textContent = file.name;

      fileSize.textContent =
        (file.size / (1024 * 1024)).toFixed(2) + " MB";

      videoPreview.onloadedmetadata = function () {

        const videoDuration = videoPreview.duration;

        const minutes =
          Math.floor(videoDuration / 60);

        const seconds =
          Math.floor(videoDuration % 60);

        duration.textContent =
          minutes + " min " +
          seconds + " sec";

        videoInfo.style.display = "block";

        if (videoDuration > MAX_DURATION) {

          status.innerHTML =
            '<span class="error">❌ Video က 5 မိနစ်ကျော်နေပါတယ်။ အများဆုံး 5 မိနစ်ပဲ တင်နိုင်ပါတယ်။</span>';

          movieFile.value = "";

          videoPreview.pause();
          videoPreview.removeAttribute("src");
          videoPreview.load();

          videoPreview.style.display = "none";
          videoInfo.style.display = "none";

          return;
        }

        status.innerHTML =
          '<span class="success">✅ Movie Upload အောင်မြင်ပါတယ်။ 5 မိနစ်အတွင်းရှိပါတယ်။</span>';
      };

    });

  </script>

</body>
</html>
